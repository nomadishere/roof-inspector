function splitSql(q){const out=[];let cur='',inq=false;for(let i=0;i<q.length;i++){const ch=q[i];if(ch==="'"){if(inq&&q[i+1]==="'"){cur+="''";i++;continue}inq=!inq}if(ch===';'&&!inq){if(cur.trim())out.push(cur.trim());cur='';continue}cur+=ch}if(cur.trim())out.push(cur.trim());return out}
async function sql(query){
  if(hosted){if(!session)throw new Error('Please sign in');const {data,error}=await sb.rpc('crm_run',{stmts:splitSql(query)});if(error){if(/JWT|auth/i.test(error.message)){session=null;go()}throw new Error(error.message)}return data||[]}
  return parseRows(await callTool('Supabase','execute_sql',{project_id:PID,query}))}
async function fn(call){const r=await sql('select '+call+' as d');const d=r[0]&&r[0].d;return typeof d==='string'?JSON.parse(d):d}

const now=()=>Date.now();
function fmtDue(iso){if(!iso)return'';const d=new Date(iso),t=d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:TZ});const day=d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',timeZone:TZ});const today=new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',timeZone:TZ});return day===today?t:day+' · '+t}
function clockText(ms){const late=ms<0;ms=Math.abs(ms);const h=Math.floor(ms/3600000),m=Math.floor(ms%3600000/60000),s=Math.floor(ms%60000/1000);const p=n=>String(n).padStart(2,'0');return (late?'+':'')+(h>99?Math.floor(h/24)+'d '+p(h%24)+'h':p(h)+':'+p(m)+':'+p(s))}
function phoneFmt(p){const d=String(p||'').replace(/\D/g,'').slice(-10);return d.length===10?`(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`:p}
function contactBtns(phones,emails,sm,ic){const p=(phones||[])[0],e=(emails||[])[0];let h='';const c=`b ${sm?'sm':''} ${ic?'ic':''}`;if(p)h+=`<a class="${c}" href="tel:${esc(p)}" aria-label="Call">${ICON.call}${ic?'':'Call'}</a><a class="${c}" href="sms:${esc(p)}" aria-label="Text">${ICON.text}${ic?'':'Text'}</a>`;if(e)h+=`<a class="${c}" href="mailto:${esc(e)}" aria-label="Email">${ICON.mail}${ic?'':'Email'}</a>`;return h}

const first=n=>String(n||'').replace(/^(the|jack|chad)\b/i,m=>m).split(/[ (—·/]/).filter(Boolean)[0]||'';
function ago(ms){const m=Math.round(Math.abs(ms)/60000);if(m<60)return m+'M';const h=Math.round(m/60);if(h<48)return h+'H';return Math.round(h/24)+'D'}
function drawOrbs(d){const items=[];const t=now();
  (d.proposals||[]).forEach(p=>{const due=p.proposal_due_at?new Date(p.proposal_due_at).getTime():t;items.push({href:'#job-'+p.id,label:first(p.contact)||first(p.title),due})});
  (d.tasks||[]).forEach(x=>{if(!items.find(i=>i.href==='#job-'+x.job_id))items.push({href:x.job_id?'#job-'+x.job_id:'#today',label:first(x.contact)||first(x.title),due:new Date(x.due_at).getTime()})});
  (d.upcoming||[]).slice(0,4).forEach(x=>items.push({href:x.job_id?'#job-'+x.job_id:'#today',label:first(x.contact)||first(x.title),due:new Date(x.due_at).getTime(),future:1}));
  items.sort((a,b)=>a.due-b.due);
  $('#orbs').innerHTML=items.slice(0,14).map(i=>{const ms=i.due-t;const cls=ms<-2*864e5?'orr':ms<0?'or':ms<12*36e5?'oy':'og';const lab=ms<0?ago(ms):ms<864e5?ago(ms):new Date(i.due).toLocaleDateString('en-US',{weekday:'short',timeZone:TZ}).toUpperCase();
    return `<a class="orb ${cls}" href="${i.href}"><i>${lab}</i><span>${esc(i.label)}</span></a>`}).join('')||'<div class="s" style="padding:6px 2px">Nothing urgent. Nice.</div>'}
const Today=guard(async()=>{
  status('Syncing…');const d=await fn('crm.app_today()');cache.today=d;drawOrbs(d);
  const tm=new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:TZ});status('Live · synced '+tm);
  const safe=d.open_deals?Math.round(100*(1-d.slipping/d.open_deals)):100;
  const props=d.proposals||[],rank={Urgent:0,High:1,Normal:2,Low:3},tasks=(d.tasks||[]).sort((a,b)=>(b.days_late-a.days_late)||(rank[a.priority]-rank[b.priority])||(new Date(a.due_at)-new Date(b.due_at)));
  const late=tasks.filter(t=>t.days_late>0),todays=tasks.filter(t=>!(t.days_late>0)),lateProps=props.filter(p=>p.days_late>0||new Date(p.proposal_due_at)<new Date());
  const worst=Math.max(0,...late.map(t=>t.days_late),...props.map(p=>p.days_late||0));
  V.innerHTML=`${late.length||lateProps.length?`<div class="alarm" role="alert"><div class="big">▲ ${late.length+lateProps.length} missed — do these first</div><div class="sub">Oldest is ${worst} day${worst===1?'':'s'} late. Every day they wait, they get bigger and louder.</div></div>`:''}
  <div class="grid" style="margin-top:8px">
   <div class="card stat"><div class="k">Missed</div><div class="v" style="color:${late.length+lateProps.length?'var(--red)':'var(--green)'};${late.length+lateProps.length?'text-shadow:0 0 12px rgba(255,77,77,.5)':''}">${late.length+lateProps.length}</div></div>
   <div class="card stat"><div class="k">Proposals due</div><div class="v" style="color:var(--amber)">${props.length}</div></div>
   <div class="card stat"><div class="k">Clients safe</div><div class="v" style="color:${safe>=80?'var(--green)':safe>=60?'var(--amber)':'var(--red)'}">${safe}%</div><div class="risk"><i style="width:${safe}%;background:${safe>=80?'var(--green)':safe>=60?'var(--amber)':'var(--red)'}"></i></div></div>
   <div class="card stat"><div class="k">Open pipeline</div><div class="v">$${Math.round((d.open_value||0)/1000)}K</div></div>
  </div>
  ${late.length?`<h2>Missed <span class="n">${late.length}</span></h2><div class="grid">${late.map(t=>tile(t,'late'+Math.min(3,t.days_late))).join('')}</div>`:''}
  <h2>Proposal clock <span class="n">${props.length}</span></h2>
  <div class="grid">${props.length?props.map(p=>{const due=p.proposal_due_at?new Date(p.proposal_due_at).getTime():now()+3600e3;const lateD=Math.max(0,p.days_late||0);return `<div class="card w2 ${lateD>0?'late'+Math.min(3,lateD):due<now()?'late1':''}">
    <div class="row"><div class="grow"><a href="#job-${p.id}" class="t">${esc(p.title)}</a><div class="s">${esc(p.contact||'')}</div></div><span class="pill ${prClass[p.priority]}">${esc(p.priority)}</span></div>
    <div class="row"><div class="clock grow" data-due="${due}">--:--:--</div><div class="s" style="text-align:right">${p.estimates?p.estimates+' option'+(p.estimates>1?'s':''):'no estimate yet'}</div></div>
    <div class="bar" data-due="${due}" data-start="${p.inspected_at?new Date(p.inspected_at).getTime():due-3600e3}"><i style="width:0"></i></div>
    <div class="s" style="margin-top:7px;color:var(--text)">${esc(p.next_action||'')}</div>
    <div class="btns"><a class="b p f" href="#job-${p.id}">${ICON.send}Build and send</a>${contactBtns(p.phones,p.emails,1,1)}</div></div>`}).join(''):'<div class="card w2 empty">No proposals waiting. Log an inspection and the 60-minute clock starts.</div>'}</div>
  <h2>Today <span class="n">${todays.length} · ${d.done_today} done</span></h2>
  <div class="grid">${todays.length?todays.map(t=>tile(t,'')).join(''):'<div class="card w2 empty">All clear for today.</div>'}</div>
  <h2>Coming up <span class="n">${(d.upcoming||[]).length}</span></h2>
  <div class="grid">${(d.upcoming||[]).slice(0,10).map(t=>`<div class="card"><div class="t">${esc(t.title)}</div><div class="tag" style="color:var(--green)">${esc(fmtDue(t.due_at))}</div></div>`).join('')||'<div class="card w2 empty">Nothing scheduled yet.</div>'}</div>`;
  startClocks();
});
function tile(t,cls){const late=t.days_late>0,soon=!late&&t.due_at&&new Date(t.due_at)-new Date()<2*36e5;const tag=late?`${t.days_late} day${t.days_late===1?'':'s'} late`:new Date(t.due_at)<new Date()?'Overdue · '+fmtDue(t.due_at):'Due '+fmtDue(t.due_at);
  return `<div class="card ${cls}" id="t-${t.id}"><div class="row" style="align-items:flex-start"><button class="chk" aria-label="Mark done" onclick="doneTask('${t.id}',this)">${ICON.check}</button><div class="grow"><div class="t">${esc(t.title)}</div><div class="s">${esc(t.contact||'')}</div></div></div>
   <span class="tag" style="color:${late||new Date(t.due_at)<new Date()?'var(--red)':soon?'var(--amber)':'var(--green)'}">${esc(tag)}</span>
   <div class="acts">${contactBtns(t.phones,t.emails,1,1)}<button class="b sm ic" aria-label="Move to tomorrow" onclick="snooze('${t.id}')">${ICON.snooze}</button>${t.job_id?`<a class="b sm" href="#job-${t.job_id}">Open</a>`:''}</div></div>`}
function taskRow(t){return tile(t,'')}
function startClocks(){const tick=()=>{document.querySelectorAll('.clock[data-due]').forEach(el=>{const ms=+el.dataset.due-now();el.textContent=ms<0?clockText(ms)+' late':clockText(ms);el.classList.toggle('late',ms<0)});document.querySelectorAll('.bar[data-due]').forEach(el=>{const due=+el.dataset.due,st=+el.dataset.start,pct=Math.max(0,Math.min(100,(now()-st)/(due-st)*100));el.firstElementChild.style.width=pct+'%';el.classList.toggle('late',now()>due)})};tick();window._tick=setInterval(tick,1000)}
window.doneTask=async(id,btn)=>{btn.classList.add('on');try{await sql(`update crm.tasks set done_at=now() where id=${q(id)}; insert into crm.notes(contact_id,job_id,kind,body,author,source) select contact_id,job_id,case kind when 'call' then 'call' when 'text' then 'text' else 'note' end,'Done: '||title,'Justin','App' from crm.tasks where id=${q(id)}; select 1`);status('Done ✓');setTimeout(()=>{const r=$('#t-'+id);if(r)r.remove()},350)}catch(e){btn.classList.remove('on');status('Could not save: '+e.message)}};
window.snooze=async id=>{try{await sql(`update crm.tasks set due_at=(((now() at time zone '${TZ}')::date+1)+time '09:00') at time zone '${TZ}' where id=${q(id)}; select 1`);const r=$('#t-'+id);if(r)r.remove();status('Moved to tomorrow 9:00')}catch(e){status('Could not save: '+e.message)}};

/* ---------- PIPELINE ---------- */
const STAGES=['Lead','Inspection','Proposal Due','Proposal Sent','Approved','Scheduled','In Progress','On Hold'];
let pipeFilter='Hot';
const Pipeline=guard(async()=>{status('Syncing…');const rows=await fn('crm.app_pipeline()');cache.pipe=rows;status(rows.length+' open deals');drawPipe()});
function drawPipe(){const rows=cache.pipe||[];const counts={};rows.forEach(r=>counts[r.stage]=(counts[r.stage]||0)+1);
  const hot=rows.filter(r=>r.stage!=='On Hold');const list=pipeFilter==='Hot'?hot:rows.filter(r=>r.stage===pipeFilter);
  V.innerHTML=`<div class="chips">${['Hot',...STAGES].map(s=>`<button class="chip ${s===pipeFilter?'on':''}" onclick="pipeFilter='${s}';drawPipe()">${s==='Hot'?'Active':s} ${s==='Hot'?hot.length:(counts[s]||0)}</button>`).join('')}</div>
  <div class="grid" style="margin-top:10px">${list.length?list.map(r=>`<a class="card" style="display:block" href="#job-${r.id}"><div class="row"><div class="grow"><div class="t">${esc(r.title)}</div><div class="s">${esc(r.contact||'')} · ${esc(r.stage)}${r.value?' · $'+Number(r.value).toLocaleString():''}</div></div></div>
   ${r.next_action?`<div class="s" style="margin-top:6px;color:var(--text)">${esc(r.next_action)}</div>`:''}<div class="s">${r.days_quiet!=null?r.days_quiet+' days quiet':'No contact logged'}${r.next_action_due?' · due '+esc(r.next_action_due):''}</div>
   <div class="risk"><i style="width:${r.risk}%;background:${r.risk>=70?'var(--red)':r.risk>=45?'var(--amber)':'var(--green)'}"></i></div></a>`).join(''):'<div class="card w2 empty">Nothing in this stage.</div>'}</div>
   ${pipeFilter==='On Hold'?'<div class="s" style="margin-top:12px">Revive pile: older leads from Gage\'s message export. Open one, check the thread, set a next step.</div>':''}`}

const Search=guard(async()=>{if(!cache.people)cache.people=await fn(`crm.app_people('')`);if(!cache.pipe)cache.pipe=await fn('crm.app_pipeline()');status('Type to jump anywhere');

const Contact=guard(async id=>{status('Loading…');const r=await sql(`select row_to_json(c) d, (select json_agg(json_build_object('id',j.id,'title',j.title,'stage',j.stage)) from crm.jobs j where j.contact_id=c.id) jobs from crm.contacts c where c.id=${q(id)}`);const c=typeof r[0].d==='string'?JSON.parse(r[0].d):r[0].d;const jobs=typeof r[0].jobs==='string'?JSON.parse(r[0].jobs):(r[0].jobs||[]);status(c.category);

window.newJob=async cid=>{const r=await sql(`insert into crm.jobs(ref,contact_id,title,stage,priority,owner,next_action,next_action_due,source) select 'A:'||extensions.uuid_generate_v4(), id, name||' — new job','Lead','High','Justin','Call and schedule the inspection',(now() at time zone '${TZ}')::date,'App' from crm.contacts where id=${q(cid)} returning id`);location.hash='job-'+r[0].id};

function AddLead(){status('Speed to lead: a call task is created for the next 15 minutes');
  V.innerHTML=`<form class="card" id="lf"><label class="f" style="margin-top:0">Name</label><input type="text" name="name" required placeholder="Jane Smith">

  <label class="f">Job address</label><input type="text" name="addr" placeholder="123 Main St, Livingston"><label class="f">What do they need?</label><textarea name="scope" placeholder="Leak over the kitchen, metal roof quote"></textarea>
  <label class="f">Where did they come from?</label><select name="src"><option>Referral</option><option>Facebook</option><option>Google</option><option>Website</option><option>Yard sign</option><option>Door knock</option><option>Other</option></select>
  <div class="s" id="lerr" style="color:var(--red);margin-top:8px"></div><div class="btns"><button class="b p f" type="submit">Save and call</button></div></form>`;

function mulaw(s){const B=0x84,C=32635;let sign=(s>>8)&0x80;if(sign)s=-s;if(s>C)s=C;s+=B;let e=7;for(let m=0x4000;(s&m)===0&&e>0;e--,m>>=1);const man=(s>>(e+3))&0x0F;return ~(sign|(e<<4)|man)&0xFF}

  await new Promise((res,rej)=>{v.onloadedmetadata=res;v.onerror=()=>rej(new Error('This video format can\'t be read here. Save it to the Drive folder instead.'))});

  const small=document.createElement('canvas'),big=document.createElement('canvas'),sw=96,sh=Math.round(sw*v.videoHeight/v.videoWidth),bw=768,bh=Math.round(bw*v.videoHeight/v.videoWidth);small.width=sw;small.height=sh;big.width=bw;big.height=bh;

    bx.drawImage(v,0,0,bw,bh);const jb=await new Promise(r=>big.toBlob(r,'image/jpeg',.62));frames.push({i,t:i/2,diff,blob:jb});if(i%10===0)P.lastChild&&(P.textContent=P.textContent.replace(/Frames .*\n$/,'')+`Frames ${i+1}/${N}\n`)}
  // key frames: the most changed moments, spread across the video (every frame is still read by the AI below)
  const K=Math.min(24,frames.length),seg=frames.length/K,keys=[];for(let s=0;s<K;s++){const part=frames.slice(Math.floor(s*seg),Math.floor((s+1)*seg));if(part.length)keys.push(part.reduce((a,b)=>b.diff>a.diff?b:a))}
  $('#strip').innerHTML=keys.slice(0,8).map(k=>`<img alt="" src="${URL.createObjectURL(k.blob)}">`).join('');log(`Picked ${keys.length} key frames`);
  // save inspection (this starts the 60-minute clock)
  const ins=await sql(`insert into crm.inspections(job_id,source,video_name,recorded_at,duration_sec,frame_count,status) values (${q(d.job.id)},'app',${q(file.name)},${q(new Date(file.lastModified||Date.now()).toISOString())},${dur.toFixed(1)},${N},'processing') returning id`);const iid=ins[0].id;log('Saved. 60-minute proposal clock started.');
  for(let s=0;s<keys.length;s+=4){const part=keys.slice(s,s+4);const vals=[];for(const k of part)vals.push(`(${q(iid)},${k.i},${k.t},${q(await blob2b64(k.blob))},true)`);await sql(`insert into crm.inspection_frames(inspection_id,idx,t_sec,jpeg_b64,key_frame) values ${vals.join(',')}; select 1`)}
  log('Key frames saved');
  // narration: 8 kHz μ-law WAV, saved in chunks for transcription
  let audioOk=false;try{log('Pulling the narration…');const ab=await file.arrayBuffer();const ac=new (window.AudioContext||window.webkitAudioContext)();const dec=await ac.decodeAudioData(ab);const off=new OfflineAudioContext(1,Math.ceil(dec.duration*8000),8000);const src=off.createBufferSource();src.buffer=dec;src.connect(off.destination);src.start();const rend=await off.startRendering();const wav=b64(wavMulaw(rend.getChannelData(0),8000));
    const CH=400000;for(let c=0,n=0;c<wav.length;c+=CH,n++)await sql(`insert into crm.inspection_audio(inspection_id,chunk_no,b64) values (${q(iid)},${n},${q(wav.slice(c,c+CH))}); select 1`);audioOk=true;log('Narration saved: transcript arrives with the next sync');}catch(e){log('Narration could not be read on this device. Also drop the video in the Drive folder so it gets transcribed.')}
  // AI read of the frames
  let findings=null,draft=null;
  if(!sampler){try{sampler=await claude.use('sample')}catch(e){}}
  if(sampler){const lim=await (sampler.limits?sampler.limits():{images:8});const per=Math.max(1,Math.min(8,(lim&&lim.images)||8));
    const pick=[];const step=Math.max(1,Math.floor(frames.length/(per*6)));for(let i=0;i<frames.length;i+=step)pick.push(frames[i]);
    const ctx=`Job: ${d.job.title}\nAddress: ${d.job.address||'unknown'}\nKnown scope: ${d.job.scope||'none'}\nCustomer: ${(d.contact||{}).name||''}`;const obs=[];
    for(let s=0;s<pick.length;s+=per){const part=pick.slice(s,s+per);log(`AI reading frames ${s+1}-${s+part.length} of ${pick.length}…`);
      try{const r=await sampler.json(`You are a senior roof inspector for Lucky Line Roofing in Montana reviewing frames from a walk-around inspection video (2 frames per second). ${ctx}\nFrame times (seconds): ${part.map(p=>p.t).join(', ')}.\nReturn JSON only: {"observations":[{"t":seconds,"area":"e.g. north slope, chimney, valley, gutters","issue":"what you see","severity":"low|medium|high"}],"roof_type":"","materials":"","notes":""}. Only report what is visible. Skip frames that show nothing useful.`,{images:part.map(p=>p.blob),modelTier:'default'});if(r&&r.observations)obs.push(...r.observations.map(o=>({...o})));}catch(e){log('A batch was skipped: '+(e.message||e.code))}}
    log('Writing the inspection report and proposal draft…');
    try{const r=await sampler.json(`You write inspection reports and proposals for Lucky Line Roofing (Montana; tagline "Shelter you can count on, service you'll remember."; phone 406-609-9950). ${ctx}\nObservations from the walk-around video frames:\n${JSON.stringify(obs).slice(0,12000)}\nReturn JSON only: {"summary":"2-3 sentences","findings":[{"area":"","issue":"","severity":"low|medium|high"}],"scope":[{"item":"","detail":""}],"questions":["things to confirm before pricing"],"proposal_text":"A warm, plain-English proposal email to the customer: what we found, what we recommend (good/better/best options when it makes sense), next steps. Leave every price as $____ for the team to fill in. Sign off from Justin Walton, Lucky Line Roofing, 406-609-9950."}`,{modelTier:'complex'});findings=r;draft=r.proposal_text||'';}catch(e){log('Draft failed: '+(e.message||e.code))}}
  else log('AI is not available in this view; frames and narration are saved and will be drafted at the next sync.');
  await sql(`update crm.inspections set findings=${findings?q(JSON.stringify(findings))+'::jsonb':'null'},proposal_draft=${q(draft)},status=${q(findings?(audioOk?'drafted':'drafted'):'needs_transcript')} where id=${q(iid)}; select 1`);
  log('Done. Opening the job…');setTimeout(()=>location.hash='job-'+d.job.id,600);
  }catch(e){log('Stopped: '+e.message);$('#vid').disabled=false}}

/* ---------- boot ---------- */
setInterval(()=>{const e=$('#clockTop');if(e)e.textContent=new Date().toLocaleString('en-US',{weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false,timeZone:TZ}).toUpperCase()},1000);
async function refreshOrbs(){try{if(!cache.today||Date.now()-(cache.todayAt||0)>60000){cache.today=await fn('crm.app_today()');cache.todayAt=Date.now()}drawOrbs(cache.today)}catch(e){}}
(async()=>{
  if(!window.claude||!window.claude.use){hosted=true;session=store.get();
    $('#live').classList.toggle('off',!session);if(session){$('#signout').style.display='grid';status((session.email||'')+' · signed in')}go();if(session){setTimeout(refreshOrbs,1200);setInterval(refreshOrbs,60000)}return}
  go();try{mcp=await claude.use('mcp')}catch(e){mcp=null}
  $('#live').classList.toggle('off',!mcp);if(mcp){go();setTimeout(refreshOrbs,1500);setInterval(refreshOrbs,60000)}else status('Not connected: open in Claude to load your data')})();
</script>
</body>
